@media(min-width:680px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.info{padding:16px}.title{font-size:16px}}
/* 商品圖片放大視窗 */
.image-lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.88);
  z-index: 99999;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.image-lightbox.open {
  display: flex;
}

.image-lightbox img {
  max-width: 95%;
  max-height: 90vh;
  object-fit: contain;
}

.image-lightbox .close-lightbox {
  position: absolute;
  top: 20px;
  right: 25px;
  background: none;
  border: none;
  color: white;
  font-size: 36px;
  cursor: pointer;
}

.track img {
  cursor: zoom-in;

<body>
<nav><button class="menu" type="button" id="openMenu">☰</button><div class="brand">oh.maygot_uk</div><a class="line-link" href="https://line.me/R/ti/p/@029ieror" target="_blank" rel="noopener">官方 LINE</a></nav>

<header><h1>oh.maygot_uk</h1><p>英國選物代購 ｜ 現貨與預購商品目錄</p><a href="https://line.me/R/ti/p/@029ieror" target="_blank" rel="noopener">♡ 加入官方 LINE 詢問商品</a></header>
<main><div class="tools"><input id="searchInput" type="search" placeholder="搜尋商品名稱或關鍵字…" aria-label="搜尋商品"><span id="resultCount">共 1 件商品</span></div><div class="grid" id="productGrid"><article class="card"><div class="image-box"><div class="track"><img src="/winnie_1.jpg" alt="金黃冬日維尼照片1"><img src="/winnie_2.jpg" alt="金黃冬日維尼照片2"></div><span class="badge preorder">預購開團</span></div><div class="info"><div class="category">冬日金黃系列</div><div class="title">Selfridges限定－金黃冬日維尼</div><div class="note">英國百貨限定款・預計到貨約4–5週</div><div class="price">NT$ 2,600</div><a class="buy" href="https://line.me/R/ti/p/@029ieror" target="_blank" rel="noopener noreferrer">♡ LINE 詢問商品</a></div></article></div><div class="empty" id="emptyMessage" hidden>目前沒有符合條件的商品 🤎</div></main><footer>© oh.maygot_uk · 精選每一份喜歡</footer>
<script>
/* 商品資料：未來新增商品，只需要在 PRODUCTS 陣列增加一個物件。圖片請上傳至與 index.html 相同的資料夾。 */
const PRODUCTS = [
  {

    status: "preorder",

    type: "plush",

  },
  
  {

    keywords: ["小豬", "piglet", "Selfridges", "disney", "迪士尼"]
  },

  {
    id: "003",

    images: ["/images/disney/tigger_1.jpg", "/images/disney/tigger_2.jpg", "/images/disney/tigger_3.jpg"],
    keywords: ["跳跳虎", "tigger", "Selfridges", "disney", "迪士尼"]
  },

  {
    id: "004",
    name: "Selfridges限定－金黃冬日屹耳",
    price: 2600,
    status: "preorder",
    series: "selfridges-gold",
    type: "plush",
    note: "英國selfridges百貨限定款・預計到貨約4–5週",
    images: ["/images/disney/eeyore_1.jpg", "/images/disney/eeyore_2.jpg", "/images/disney/eeyore_3.jpg"],
    keywords: ["屹耳", "eeyore", "Selfridges", "disney", "迪士尼"]
  },

   {
    id: "005",
    name: "屹耳衛兵吊飾",
    price: 1350,
    status: "instock",
    soldout: false,
    series: "disney",
    shopUrl: "https://myship.7-11.com.tw/general/detail/GM2611179788883",
    type: "keychain",
    note: "在台現貨・下單後48小時內寄出",
    images: ["/eeyoreguardsman_1.jpg", "/eeyoreguardsman_2.jpg", "/eeyoreguardsman_3.jpg"],
    keywords: ["屹耳", "eeyore", "吊飾"]
   },

 {
    id: "006",
    name: "Jellycat趴趴史馬吉熊貓",
    price: 3280,
    status: "instock",
    soldout: false,
    series: "jellycat-retired",
    shopUrl: "https://myship.7-11.com.tw/general/detail/GM2611179788883",
    type: "plush",
    note: "在台現貨・下單後48小時內寄出",
    images: ["/smudgepanda_1.jpg", "/smudgepanda_2.jpg", "/smudgepanda_3.jpg"],
    keywords: ["jellycat", "smudge", "史馬吉", "熊貓", "絕版"]
   } 
];
const SHOP_URL = "https://myship.7-11.com.tw/general/detail/GM2611179788883";
const LINE_URL = "https://line.me/R/ti/p/@029ieror";
const SERIES = {"selfridges-gold":"冬日金黃系列","jp-disney-white":"日本迪士尼白色冬季新品","jellycat-retired":"Jellycat絕版收藏","jellycat-regular":"Jellycat常態販售","disney":"Disney 迪士尼","other":"其他選物"};
const STATUS = {instock:"現貨",preorder:"預購開團",soldout:"已售完"};
let currentStatus = "all";
let currentSeries = "all";
const drawer = document.getElementById("drawer");
const overlay = document.getElementById("overlay");
function toggleDrawer(open){drawer.classList.toggle("open",open);overlay.classList.toggle("open",open)}
document.getElementById("openMenu").addEventListener("click",()=>toggleDrawer(true));
document.getElementById("closeMenu").addEventListener("click",()=>toggleDrawer(false));
overlay.addEventListener("click",()=>toggleDrawer(false));
function button(label,active,handler){const el=document.createElement("button");el.type="button";el.className="filter"+(active?" active":"");el.textContent=label;el.addEventListener("click",handler);return el}
function renderFilters(){
  const root=document.getElementById("filters");root.replaceChildren();
  root.appendChild(button("全部商品",currentStatus==="all",()=>{currentStatus="all";currentSeries="all";renderFilters();renderProducts();toggleDrawer(false)}));
  for(const [key,label] of [["instock","⚡ 現貨專區"],["preorder","🛍️ 預購開團"]]){
    root.appendChild(button(label+(currentStatus===key?" ▴":" ▾"),currentStatus===key,()=>{currentStatus=key;currentSeries="all";renderFilters();renderProducts()}));
    if(currentStatus===key){
      const sub=document.createElement("div");sub.className="sub";
      sub.appendChild(button("全部系列",currentSeries==="all",()=>selectSeries("all")));
      for(const [series,name] of Object.entries(SERIES))sub.appendChild(button(name,currentSeries===series,()=>selectSeries(series)));
      root.appendChild(sub);
    }
  }
}
function selectSeries(series){currentSeries=series;renderFilters();renderProducts();toggleDrawer(false)}
function renderProducts(){
  const keyword=document.getElementById("searchInput").value.trim().toLocaleLowerCase();
  const shown=PRODUCTS.filter(p=>(currentStatus==="all"||p.status===currentStatus)&&(currentSeries==="all"||p.series===currentSeries)&&(!keyword||[p.name,p.note,SERIES[p.series],...(p.keywords||[])].join(" ").toLocaleLowerCase().includes(keyword)));
  document.getElementById("resultCount").textContent=`共 ${shown.length} 件商品`;
  document.getElementById("emptyMessage").hidden=shown.length!==0;
  const grid=document.getElementById("productGrid");grid.replaceChildren();
  shown.forEach(p=>{
    const card=document.createElement("article");card.className="card";
    const box=document.createElement("div");box.className="image-box";
    const track=document.createElement("div");track.className="track";
    for(const src of (p.images||[])){
      const img=document.createElement("img");img.src=src;img.alt=p.name;img.loading="eager";
      img.addEventListener("error",()=>{img.removeAttribute("src");img.alt="圖片尚未上傳"},{once:true});track.appendChild(img);
    }
    if(!track.children.length){const placeholder=document.createElement("div");placeholder.textContent="圖片準備中";placeholder.style.padding="30px";track.appendChild(placeholder)}
    box.appendChild(track);
    const badge=document.createElement("span");badge.className="badge "+p.status;badge.textContent=STATUS[p.status]||"商品";box.appendChild(badge);
    if((p.images||[]).length>1){for(const [cls,symbol,dir] of [["prev","‹",-1],["next","›",1]]){const arrow=document.createElement("button");arrow.type="button";arrow.className="arrow "+cls;arrow.textContent=symbol;arrow.setAttribute("aria-label",dir<0?"上一張":"下一張");arrow.addEventListener("click",()=>track.scrollBy({left:dir*track.clientWidth,behavior:"smooth"}));box.appendChild(arrow)}}
    const info=document.createElement("div");info.className="info";
    for(const [cls,value] of [["category",SERIES[p.series]||"精選商品"],["title",p.name],["note",p.note||""],["price","NT$ "+Number(p.price).toLocaleString("zh-TW")]]){const el=document.createElement("div");el.className=cls;el.textContent=value;info.appendChild(el)}
    /* 商品下單按鈕 */

const isSoldout = p.soldout === true || p.status === "soldout";

const buy = document.createElement(isSoldout ? "span" : "a");

buy.className = "buy" + (isSoldout ? " disabled" : "");

if (isSoldout) {
  buy.textContent = "已售完";
} else if (p.status === "instock") {
  buy.textContent = "🛒 賣貨便下單";
  buy.href = p.shopUrl || SHOP_URL;
} else {
  buy.textContent = "♡ LINE 詢問商品";
  buy.href = LINE_URL;
}

if (!isSoldout) {
  buy.target = "_blank";
  buy.rel = "noopener noreferrer";
}

info.appendChild(buy);
    card.append(box,info);grid.appendChild(card);
  });
}
document.getElementById("searchInput").addEventListener("input",renderProducts);
renderFilters();renderProducts();
/* 點擊商品圖片放大 */

function openLightbox(src) {
  const lightbox = document.getElementById("imageLightbox");
  const image = document.getElementById("lightboxImage");

  image.src = src;
  lightbox.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeLightbox() {
  const lightbox = document.getElementById("imageLightbox");

  lightbox.classList.remove("open");
  document.body.style.overflow = "";
}

/* 自動偵測所有商品圖片 */
document.addEventListener("click", function(event) {
  const image = event.target.closest(".track img");

  if (image) {
    openLightbox(image.src);
  }

  if (event.target.id === "imageLightbox") {
    closeLightbox();
  }
});

/* 按 ESC 關閉放大圖片 */
document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") {
    closeLightbox();
  }
});
</script>
