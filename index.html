<style>
:root {
  --cream: #F7F1E8;
  --beige: #E8DDCE;
  --brown: #4B4035;
  --light: #FFFCF8;
  --accent: #B08968;
  --line: #E9E0D6;
  --green: #06C755;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont,
  "Noto Sans TC", sans-serif;
  background: var(--light);
  color: var(--brown);
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

/* 導覽列 */

nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,252,248,.97);
  border-bottom: 1px solid var(--line);
  padding: 13px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 1px;
}

.menu-btn {
  border: none;
  background: none;
  font-size: 23px;
  color: var(--brown);
}

.line-small {
  background: var(--green);
  color: white;
  text-decoration: none;
  padding: 8px 12px;
  border-radius: 20px;
  font-size: 12px;
}

/* 頁首 */

header {
  text-align: center;
  background: var(--cream);
  padding: 43px 20px 36px;
}

header h1 {
  font-family: Georgia, serif;
  font-size: 31px;
  letter-spacing: 2px;
  margin: 0 0 12px;
}

header p {
  font-size: 13px;
  color: #8D7D6D;
  letter-spacing: 2px;
  line-height: 1.9;
}

.header-line {
  display: inline-block;
  margin-top: 15px;
  padding: 11px 23px;
  border: 1px solid var(--brown);
  border-radius: 25px;
  color: var(--brown);
  text-decoration: none;
  font-size: 13px;
}

/* 搜尋 */

.search-section {
  max-width: 1100px;
  margin: auto;
  padding: 22px 16px 12px;
}

.search-box {
  width: 100%;
  padding: 13px 17px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: white;
  outline: none;
}

.search-box:focus {
  border-color: var(--accent);
}

/* 狀態列 */

.status-bar {
  max-width: 1100px;
  margin: auto;
  padding: 8px 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
}

.filter-btn {
  border: 1px solid var(--line);
  background: white;
  padding: 8px 14px;
  border-radius: 20px;
  color: var(--brown);
}

/* 商品區 */

.container {
  max-width: 1100px;
  margin: auto;
  padding: 0 14px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 13px;
}

.card {
  background: white;
  border-radius: 13px;
  overflow: hidden;
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
}

.img-box {
  position: relative;
  aspect-ratio: 3 / 4;
  background: var(--cream);
  overflow: hidden;
}

.track {
  height: 100%;
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
}

.track::-webkit-scrollbar {
  display: none;
}

.track img {
  width: 100%;
  height: 100%;
  flex: 0 0 100%;
  object-fit: contain;
  scroll-snap-align: start;
}

.badge {
  position: absolute;
  top: 9px;
  left: 9px;
  z-index: 2;
  padding: 5px 9px;
  border-radius: 5px;
  color: white;
  font-size: 11px;
}

.badge.instock {
  background: #729384;
}

.badge.preorder {
  background: #C99773;
}

.badge.soldout {
  background: #999;
}

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 3;
  border: none;
  background: rgba(255,255,255,.85);
  border-radius: 50%;
  width: 28px;
  height: 28px;
  font-size: 18px;
}

.prev {
  left: 5px;
}

.next {
  right: 5px;
}

.info {
  padding: 13px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.category {
  font-size: 10px;
  color: var(--accent);
  margin-bottom: 7px;
  line-height: 1.6;
}

.title {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.6;
  margin-bottom: 8px;
}

.note {
  color: #93887D;
  font-size: 11px;
  line-height: 1.7;
  margin-bottom: 12px;
}

.price {
  font-size: 17px;
  font-weight: 700;
  margin-top: auto;
  margin-bottom: 12px;
}

.buy-btn {
  display: block;
  text-align: center;
  background: var(--brown);
  color: white;
  padding: 11px 5px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 12px;
}

.buy-btn.disabled {
  background: #CCC;
  pointer-events: none;
}

/* 側邊欄 */

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 199;
}

.overlay.open {
  display: block;
}

.drawer {
  position: fixed;
  top: 0;
  left: -310px;
  width: 290px;
  max-width: 85vw;
  height: 100%;
  background: var(--light);
  z-index: 200;
  transition: left .3s;
  padding: 22px;
  overflow-y: auto;
}

.drawer.open {
  left: 0;
}

.drawer-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
  margin-bottom: 25px;
}

.close-btn {
  background: none;
  border: none;
  font-size: 26px;
}

.section-title {
  font-size: 12px;
  color: #988B7F;
  margin: 22px 0 12px;
}

.filter-option {
  display: block;
  width: 100%;
  text-align: left;
  border: 1px solid var(--line);
  background: white;
  padding: 12px;
  border-radius: 9px;
  margin-bottom: 8px;
  color: var(--brown);
}

.filter-option.active {
  background: var(--brown);
  color: white;
}

.empty {
  text-align: center;
  padding: 60px 20px;
  color: #93887D;
  line-height: 2;
}

footer {
  text-align: center;
  margin-top: 60px;
  padding: 35px 15px;
  background: var(--cream);
  font-size: 12px;
  line-height: 2;
}

/* 電腦版 */

@media(min-width:700px) {
  .grid {
    grid-template-columns: repeat(3,1fr);
    gap: 22px;
  }

  .title {
    font-size: 16px;
  }

  .note {
    font-size: 13px;
  }
}

@media(min-width:1050px) {
  .grid {
    grid-template-columns: repeat(4,1fr);
  }
}
</style>
</head>
